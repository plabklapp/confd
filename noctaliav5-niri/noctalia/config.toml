[bar.default]
center = [ "clock", "sysmon" ]
concave_edge_corners = false
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
font_family = "Adwaita Sans"
font_weight = 400
margin_ends = 0
radius = 0
shadow = false
start = [ "launcher", "workspaces" ]
thickness = 24
widget_spacing = 12

[desktop_widgets]
enabled = false

[dock]
background_opacity = 0.99999997764825821
enabled = true
inactive_opacity = 0.99999997764825821
launcher_position = "start"
pinned = [ "org.gnome.Nautilus", "com.mitchellh.ghostty", "org.mozilla.firefox" ]
reserve_space = false
show_dots = true
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "Adwaita Sans"
polkit_agent = true

    [shell.launcher]
    pinned = [ "org.mozilla.firefox" ]

[theme]
mode = "light"
source = "wallpaper"

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.monitors.eDP-1]
path = "color:#0A0C30"

[widget.clock]
format = "{:%l:%M  -  %A, %x}"
